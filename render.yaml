services:
  - type: web
    name: crop-qc-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: dotnet CropQc.Web.dll --verify-schema=20260805014812_AddReceiptInventoryOverrides
    healthCheckPath: /health
    disks:
      - name: crop-qc-dashboard-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PROVIDER
        value: PostgreSql
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true
      - key: ConnectionStrings__CropQc
        fromDatabase:
          name: crop-qc-dashboard-db
          property: connectionString
      - key: Database__EnsureCreatedOnStartup
        value: false
      - key: Database__SeedMasterDataOnStartup
        value: false
      - key: Authentication__AllowedGoogleDomains
        value: wp-packing.com,earlbrownandsons.com,fruitandland.com
      - key: Authentication__BootstrapAdminEmails
        value: wes@fruitandland.com
      - key: Authentication__SessionDays
        value: 7
      - key: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
        value: Warning
      - key: PerformanceDiagnostics__Enabled
        value: true
      - key: PerformanceDiagnostics__RequestTimingEnabled
        value: true
      - key: PerformanceDiagnostics__EfQueryCountingEnabled
        value: true
      - key: PerformanceDiagnostics__ProcessAllocatedBytesWarningThreshold
        value: 12582912
      - key: PerformanceDiagnostics__RecentRequestLimit
        value: 0
      - key: PerformanceDiagnostics__IncludeUserIdentifier
        value: false
      - key: PerformanceDiagnostics__LogEveryRequest
        value: false
      - key: PerformanceDiagnostics__RuntimeMemoryTelemetryEnabled
        value: true
      - key: PerformanceDiagnostics__RuntimeMemoryTelemetryIntervalSeconds
        value: 60
      - key: PerformanceDiagnostics__RuntimeMemoryWarningWorkingSetBytes
        value: 402653184
      - key: PerformanceDiagnostics__RuntimeMemoryCriticalWorkingSetBytes
        value: 471859200
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: DataProtection__PersistKeysToFileSystem
        value: true
      - key: DataProtection__KeysPath
        value: /var/data/dataprotection-keys
      - key: DataProtection__ApplicationName
        value: CropQcDashboard
      - key: FileStorage__Provider
        value: GoogleDrive
      - key: FileStorage__LocalRootPath
        value: /var/data/cropqc-files
      - key: FileStorage__BasePath
        value: Crop QC Photos
      - key: GoogleDrive__UseSharedDrive
        value: true
      - key: GoogleDrive__RootFolderId
        value: 0ADHRTHdG9u98Uk9PVA
      - key: GoogleDrive__SharedDriveId
        value: 0ADHRTHdG9u98Uk9PVA
      - key: GoogleDrive__ServiceAccountJson
        sync: false
      - key: GoogleDrive__ApplicationName
        value: Crop QC Dashboard
      - key: GoogleDrive__BaseFolderName
        value: Photos
      - key: Email__Provider
        value: GmailUser
      - key: QcStation__ApiBaseUrl
        value: https://crop-qc-dashboard.onrender.com
      - key: Backups__Enabled
        value: true
      - key: Backups__Provider
        value: GoogleDrive
      - key: Backups__GoogleDriveFolderId
        sync: false
      - key: Backups__DailyRetentionDays
        value: 30
      - key: Backups__WeeklyRetentionWeeks
        value: 52
      - key: Backups__BusinessTimeZone
        value: America/Los_Angeles
      - key: Backups__NightlyPacificHour
        value: 1
      - key: Backups__NotificationRecipient
        value: wes@fruitandland.com
      - key: Backups__NotificationSender
        value: wes@fruitandland.com
  - type: cron
    name: crop-qc-production-nightly-backup
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: dotnet CropQc.Web.dll --run-backup=scheduled
    schedule: "0 8,9 * * *"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AppEnvironment__Kind
        value: Production
      - key: AppEnvironment__DisplayName
        value: Crop QC Production Backup
      - key: DATABASE_PROVIDER
        value: PostgreSql
      - key: ConnectionStrings__CropQc
        fromDatabase:
          name: crop-qc-dashboard-db
          property: connectionString
      - key: Database__EnsureCreatedOnStartup
        value: false
      - key: Database__SeedMasterDataOnStartup
        value: false
      - key: FileStorage__Provider
        value: GoogleDrive
      - key: GoogleDrive__UseSharedDrive
        value: true
      - key: GoogleDrive__SharedDriveId
        sync: false
      - key: GoogleDrive__RootFolderId
        sync: false
      - key: GoogleDrive__ServiceAccountJson
        sync: false
      - key: GoogleDrive__ApplicationName
        value: Crop QC Dashboard Backup
      - key: Backups__Enabled
        value: true
      - key: Backups__Provider
        value: GoogleDrive
      - key: Backups__GoogleDriveFolderId
        sync: false
      - key: Backups__DailyRetentionDays
        value: 30
      - key: Backups__WeeklyRetentionWeeks
        value: 52
      - key: Backups__BusinessTimeZone
        value: America/Los_Angeles
      - key: Backups__NightlyPacificHour
        value: 1
      - key: Backups__NotificationRecipient
        value: wes@fruitandland.com
      - key: Backups__NotificationSender
        value: wes@fruitandland.com
  - type: web
    name: crop-qc-dashboard-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: dotnet CropQc.Web.dll --verify-schema=20260805014812_AddReceiptInventoryOverrides
    healthCheckPath: /health
    disks:
      - name: crop-qc-dashboard-staging-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AppEnvironment__Kind
        value: Staging
      - key: AppEnvironment__DisplayName
        value: Crop QC Staging
      - key: DATABASE_PROVIDER
        value: PostgreSql
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true
      - key: ConnectionStrings__CropQc
        fromDatabase:
          name: crop-qc-dashboard-staging-db
          property: connectionString
      - key: Database__EnsureCreatedOnStartup
        value: false
      - key: Database__SeedMasterDataOnStartup
        value: false
      - key: Authentication__AllowedGoogleDomains
        value: wp-packing.com,earlbrownandsons.com,fruitandland.com
      - key: Authentication__BootstrapAdminEmails
        sync: false
      - key: Authentication__SessionDays
        value: 7
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: DataProtection__PersistKeysToFileSystem
        value: true
      - key: DataProtection__KeysPath
        value: /var/data/dataprotection-keys
      - key: DataProtection__ApplicationName
        value: CropQcDashboardStaging
      - key: FileStorage__Provider
        value: Local
      - key: FileStorage__LocalRootPath
        value: /var/data/cropqc-staging-files
      - key: FileStorage__BasePath
        value: Crop QC Staging Files
      - key: GoogleDrive__UseSharedDrive
        value: false
      - key: GoogleDrive__RootFolderId
        value: ""
      - key: GoogleDrive__SharedDriveId
        value: ""
      - key: GoogleDrive__ServiceAccountJson
        sync: false
      - key: GoogleDrive__ApplicationName
        value: Crop QC Dashboard Staging
      - key: GoogleDrive__BaseFolderName
        value: Photos
      - key: Email__Provider
        value: None
      - key: Email__QcDefaultRecipients
        value: ""
      - key: PerformanceDiagnostics__Enabled
        value: true
      - key: PerformanceDiagnostics__RecentRequestLimit
        value: 250
      - key: PerformanceDiagnostics__IncludeUserIdentifier
        value: false
      - key: QcStation__ApiBaseUrl
        value: https://crop-qc-dashboard-staging.onrender.com

databases:
  - name: crop-qc-dashboard-db
    databaseName: cropqc
    user: cropqc
  - name: crop-qc-dashboard-staging-db
    databaseName: cropqc_staging
    user: cropqc_staging
