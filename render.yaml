services:
  - type: web
    name: crop-qc-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disks:
      - name: crop-qc-dashboard-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_PROVIDER
        value: PostgreSql
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true
      - key: ConnectionStrings__CropQc
        fromDatabase:
          name: crop-qc-dashboard-db
          property: connectionString
      - key: Database__EnsureCreatedOnStartup
        value: false
      - key: Database__SeedMasterDataOnStartup
        value: false
      - key: Authentication__AllowedGoogleDomains
        value: wp-packing.com,earlbrownandsons.com,fruitandland.com
      - key: Authentication__BootstrapAdminEmails
        value: wes@fruitandland.com
      - key: Authentication__SessionDays
        value: 7
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false
      - key: DataProtection__PersistKeysToFileSystem
        value: true
      - key: DataProtection__KeysPath
        value: /var/data/dataprotection-keys
      - key: DataProtection__ApplicationName
        value: CropQcDashboard
      - key: FileStorage__Provider
        value: GoogleDrive
      - key: FileStorage__LocalRootPath
        value: /var/data/cropqc-files
      - key: FileStorage__BasePath
        value: Crop QC Photos
      - key: GoogleDrive__RootFolderId
        value: 1pcVsEpDVdYpDrTphXwsLkhuA8D-FH79I
      - key: GoogleDrive__ServiceAccountJson
        sync: false
      - key: GoogleDrive__ApplicationName
        value: Crop QC Dashboard
      - key: GoogleDrive__BaseFolderName
        value: Photos
      - key: Email__Provider
        value: None

databases:
  - name: crop-qc-dashboard-db
    databaseName: cropqc
    user: cropqc
