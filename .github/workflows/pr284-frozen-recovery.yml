name: Publish frozen PR284 recovery
on:
  push:
    branches: [codex/pr284-render-recovery-loader]
    paths: [.github/workflows/pr284-frozen-recovery.yml]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve and verify frozen archive without compiling source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download pr284-compatible-rollback-d9b2546 --repo Wes-Sysadm/Crop-QC-dashboard --pattern cropqc-pr284-rollback-d9b2546-linux-amd64.tar
          echo 'd37308e3a1ca7d8fe3c7c6e69d6b2f688d2ba287280b4a3d1329716eabe4ab32  cropqc-pr284-rollback-d9b2546-linux-amd64.tar' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          root=pathlib.Path('oci'); root.mkdir()
          with tarfile.open('cropqc-pr284-rollback-d9b2546-linux-amd64.tar') as t:
              for m in t:
                  if m.isfile() and m.name.startswith('blobs/sha256/'):
                      d=t.extractfile(m).read(); assert hashlib.sha256(d).hexdigest()==m.name.split('/')[-1]
                      p=root/m.name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(d)
          digest='16716c935188476db720858c06a6fa75e122352168cd3222cb38070994907604'
          p=root/'blobs/sha256'/digest
          (root/'oci-layout').write_text('{"imageLayoutVersion":"1.0.0"}')
          (root/'index.json').write_text(json.dumps({'schemaVersion':2,'manifests':[{'mediaType':'application/vnd.oci.image.manifest.v1+json','digest':'sha256:'+digest,'size':p.stat().st_size,'annotations':{'org.opencontainers.image.ref.name':'rollback'}}]}))
          PY
      - name: Publish exact manifest and independently retrieve all blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GH_ACTOR" --password-stdin
          skopeo copy --preserve-digests oci:oci:rollback docker://ghcr.io/wes-sysadm/crop-qc-pr284-recovery:d9b2546-runtime21
          skopeo copy --preserve-digests docker://ghcr.io/wes-sysadm/crop-qc-pr284-recovery@sha256:16716c935188476db720858c06a6fa75e122352168cd3222cb38070994907604 oci:retrieved:rollback
          python3 - <<'PY'
          import pathlib,json,hashlib
          digest='16716c935188476db720858c06a6fa75e122352168cd3222cb38070994907604'
          p=pathlib.Path('oci/blobs/sha256')
          m=json.loads((p/digest).read_bytes())
          all_digests=[digest,m['config']['digest'].split(':')[1]]+[x['digest'].split(':')[1] for x in m['layers']]
          for d in all_digests:
              a=(p/d).read_bytes();b=(pathlib.Path('retrieved/blobs/sha256')/d).read_bytes()
              assert a==b and hashlib.sha256(b).hexdigest()==d
          print(json.dumps({'registryManifest':'sha256:'+digest,'exactConfigAndLayers':True,'verifiedBlobCount':len(all_digests)}))
          PY
          skopeo logout ghcr.io
