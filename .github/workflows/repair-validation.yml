name: Repair validation

on:
  push:
    branches:
      - codex/repair-3152-3162-evans11

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore tests and production web dependencies
        run: dotnet restore tests/CropQc.Api.Tests/CropQc.Api.Tests.csproj
      - name: Build production web
        run: dotnet build src/CropQc.Web/CropQc.Web.csproj --configuration Release --no-restore
      - name: Build tests
        run: dotnet build tests/CropQc.Api.Tests/CropQc.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/CropQc.Api.Tests/CropQc.Api.Tests.csproj --configuration Release --no-build --verbosity normal
